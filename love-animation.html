<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:#ff2d55; --blush:#ff6b8a; --gold:#ffd700;
    --deep:#0d0008; --magenta:#c0006e; --lavender:#e8a0c0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--deep);min-height:100vh;overflow:hidden;font-family:'Cormorant Garamond',serif;cursor:none;}

  /* CURSOR */
  #cursor{position:fixed;pointer-events:none;z-index:9999;font-size:20px;transform:translate(-50%,-50%);transition:transform .08s;}

  /* BACKGROUND */
  .bg{position:fixed;inset:0;z-index:0;
    background:radial-gradient(ellipse 90% 70% at 15% 25%,rgba(192,0,110,.28) 0%,transparent 55%),
      radial-gradient(ellipse 70% 90% at 85% 75%,rgba(255,45,85,.2) 0%,transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 50%,rgba(40,0,25,.9) 0%,#0d0008 100%);}
  .grain{position:fixed;inset:0;z-index:1;opacity:.04;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:160px;}
  .vignette{position:fixed;inset:0;z-index:8;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.78) 100%);}
  .scanlines{position:fixed;inset:0;z-index:9;pointer-events:none;
    background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);}

  /* CANVAS */
  #particles{position:fixed;inset:0;z-index:2;pointer-events:none;}
  #aurora{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;}

  /* ORBS */
  .orb{position:fixed;border-radius:50%;pointer-events:none;z-index:2;mix-blend-mode:screen;
    animation:orbDrift var(--od,15s) ease-in-out var(--od-delay,0s) infinite alternate;}
  @keyframes orbDrift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(var(--ox,40px),var(--oy,-30px)) scale(var(--os,1.2));}}

  /* DIAGONAL TEXT */
  .diagonal-track{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
  .diagonal-text{position:absolute;white-space:nowrap;font-family:'Great Vibes',cursive;
    opacity:0;animation:diagonalMove var(--dur,12s) linear var(--delay,0s) infinite;
    text-shadow:0 0 25px currentColor,0 0 55px currentColor,0 0 90px currentColor;will-change:transform,opacity;}
  @keyframes diagonalMove{
    0%{transform:translate(var(--tx0),var(--ty0)) rotate(var(--rot,-22deg));opacity:0;}
    7%{opacity:var(--peak-op,.85);}
    93%{opacity:var(--peak-op,.85);}
    100%{transform:translate(var(--tx1),var(--ty1)) rotate(var(--rot,-22deg));opacity:0;}}

  /* FLOATING WORDS */
  .float-word{position:fixed;font-family:'Playfair Display',serif;font-style:italic;pointer-events:none;z-index:4;
    animation:floatWord var(--fd,8s) ease-in-out var(--fdelay,0s) infinite alternate;
    text-shadow:0 0 18px currentColor,0 0 36px currentColor;}
  @keyframes floatWord{
    0%{transform:translateY(0) translateX(0) rotate(var(--fr,0deg));opacity:.35;}
    100%{transform:translateY(var(--fy,-30px)) translateX(var(--fx,10px)) rotate(var(--fr2,3deg));opacity:.8;}}

  /* PETALS */
  .petal{position:fixed;pointer-events:none;z-index:5;opacity:0;
    animation:petalFall var(--pf-dur,10s) linear var(--pf-delay,0s) infinite;}
  @keyframes petalFall{
    0%{transform:translateY(-80px) translateX(0) rotate(0deg);opacity:0;}
    8%{opacity:1;}90%{opacity:.8;}
    100%{transform:translateY(110vh) translateX(var(--pf-drift,40px)) rotate(var(--pf-rot,540deg));opacity:0;}}

  /* STARS */
  .star{position:fixed;pointer-events:none;z-index:3;border-radius:50%;
    animation:starTwinkle var(--st,3s) ease-in-out var(--sd,0s) infinite alternate;}
  @keyframes starTwinkle{0%{opacity:.1;transform:scale(.6);}100%{opacity:.9;transform:scale(1.3);}}

  /* ═══ CENTER STAGE ═══ */
  .center-stage{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;pointer-events:none;}
  .frames-row{display:flex;align-items:center;gap:clamp(16px,2.5vw,36px);}

  /* PERSON FRAME */
  .person-frame{position:relative;width:clamp(100px,13vw,170px);height:clamp(120px,16vw,200px);
    animation:personFloat 5s ease-in-out infinite;}
  .person-frame:nth-child(3){animation-delay:-2.5s;}
  @keyframes personFloat{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-14px) rotate(1deg);}}

  .frame-border{position:absolute;inset:0;border-radius:50% 50% 44% 44%/60% 60% 40% 40%;
    background:linear-gradient(160deg,#ffd700 0%,#ff2d55 45%,#c0006e 100%);padding:3px;
    box-shadow:0 0 30px rgba(255,45,85,.7),0 0 70px rgba(255,45,85,.35);
    animation:framePulse 2.5s ease-in-out infinite alternate;}
  @keyframes framePulse{
    0%{box-shadow:0 0 25px rgba(255,45,85,.6),0 0 55px rgba(255,45,85,.3);}
    100%{box-shadow:0 0 50px rgba(255,215,0,.75),0 0 100px rgba(255,45,85,.4),0 0 140px rgba(192,0,110,.2);}}

  .frame-inner{width:100%;height:100%;border-radius:50% 50% 42% 42%/58% 58% 38% 38%;
    overflow:hidden;background:#1e000e;display:flex;align-items:center;justify-content:center;position:relative;}
  .frame-inner img{width:100%;height:100%;object-fit:cover;display:block;}
  .frame-inner .placeholder{font-size:clamp(40px,6vw,68px);opacity:.5;animation:fadePulse 3s infinite;}



  /* HEART CONNECTOR */
  .heart-connector{position:relative;display:flex;align-items:center;justify-content:center;
    width:clamp(70px,9vw,130px);height:clamp(70px,9vw,130px);}

  .pulse-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,45,85,.5);
    animation:pulseRing var(--pr,3s) ease-out var(--prd,0s) infinite;}
  @keyframes pulseRing{0%{transform:scale(.85);opacity:.9;}100%{transform:scale(2.5);opacity:0;}}

  .heart-wrap{position:absolute;width:85%;height:85%;animation:heartFloat 4s ease-in-out infinite;}
  @keyframes heartFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-12px) scale(1.04);}}
  .heart-svg{width:100%;height:100%;
    filter:drop-shadow(0 0 32px rgba(255,45,85,1)) drop-shadow(0 0 65px rgba(255,45,85,.55));
    animation:heartPulse 1.3s ease-in-out infinite;}
  @keyframes heartPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

  .qr-ring{position:absolute;inset:-22px;border-radius:50%;
    border:2px solid rgba(255,215,0,.3);animation:rotateSlow 18s linear infinite;}
  .qr-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;
    border:1px dashed rgba(255,107,138,.3);animation:rotateSlow 28s linear infinite reverse;}
  @keyframes rotateSlow{to{transform:rotate(360deg);}}
  .qr-dot{position:absolute;border-radius:50%;box-shadow:0 0 6px var(--gold);}

  /* TITLE */
  .main-title{font-family:'Great Vibes',cursive;font-size:clamp(46px,8vw,108px);
    background:linear-gradient(135deg,#ff8fa3 0%,#ff2d55 22%,#ffd700 52%,#ff6b8a 78%,#ffafc0 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-top:18px;background-size:200% 200%;
    animation:titleShimmer 4s ease-in-out infinite alternate;}
  @keyframes titleShimmer{
    0%{background-position:0% 50%;filter:drop-shadow(0 0 22px rgba(255,45,85,.55));}
    100%{background-position:100% 50%;filter:drop-shadow(0 0 52px rgba(255,215,0,.8));}}

  .subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:clamp(11px,1.8vw,19px);color:var(--lavender);letter-spacing:.2em;
    text-transform:uppercase;margin-top:8px;animation:fadePulse 4s ease-in-out infinite;}
  @keyframes fadePulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  /* NAME TAGS */
  .name-tag{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
    font-family:'Great Vibes',cursive;font-size:clamp(15px,2.3vw,24px);
    color:#ffd700;white-space:nowrap;text-shadow:0 0 14px rgba(255,215,0,.7);animation:fadePulse 3s infinite;}

  /* RIBBON */
  .ribbon{position:fixed;bottom:clamp(12px,2vh,24px);left:50%;transform:translateX(-50%);
    z-index:11;font-family:'Cormorant Garamond',serif;font-size:clamp(10px,1.3vw,14px);
    color:rgba(232,160,192,.5);letter-spacing:.28em;text-transform:uppercase;
    white-space:nowrap;animation:fadePulse 5s infinite;}

  /* VS CODE HINT */
  .vscode-hint{position:fixed;top:14px;right:16px;z-index:20;pointer-events:all;
    background:rgba(16,0,10,.8);border:1px solid rgba(255,45,85,.35);
    border-radius:12px;padding:12px 18px;max-width:265px;backdrop-filter:blur(10px);
    font-family:'Cormorant Garamond',serif;font-size:13px;color:rgba(232,160,192,.85);line-height:1.7;}
  .vscode-hint strong{color:#ffd700;font-size:14.5px;display:block;margin-bottom:5px;}
  .vscode-hint code{background:rgba(255,45,85,.2);border-radius:4px;padding:1px 5px;font-size:11.5px;color:#ffafc0;}
  .vscode-hint .close-btn{float:right;cursor:pointer;color:#ff6b8a;font-size:17px;line-height:1;margin-left:8px;}
  .vscode-hint ol{margin-left:17px;margin-top:4px;}
</style>
</head>

    el.style.setProperty('--tx1',`${diagLen*.6}px`);
    el.style.setProperty('--ty1',`${VH()*laneY/100-diagLen*.42}px`);
  } else {
    el.style.setProperty('--tx0',`-${diagLen*.6}px`);
    el.style.setProperty('--ty0',`${VH()*laneY/100-diagLen*.32}px`);
    el.style.setProperty('--tx1',`${diagLen*.6}px`);
    el.style.setProperty('--ty1',`${VH()*laneY/100+diagLen*.22}px`);
  }
  const dur=8+(i%8)*1.6;
  el.style.setProperty('--dur', dur+'s');
  el.style.setProperty('--delay', -(i*dur/DIAG.length)+'s');
  el.style.top='0'; el.style.left='0';
  track.appendChild(el);
});

// ─── AURORA CANVAS ────────────────────────────────────────────────────────────
const aCanvas=document.getElementById('aurora'), actx=aCanvas.getContext('2d');
let AW,AH;
const resizeA=()=>{AW=aCanvas.width=window.innerWidth;AH=aCanvas.height=window.innerHeight;};
resizeA(); window.addEventListener('resize',resizeA);
let aT=0;
(function drawAurora(){
  actx.clearRect(0,0,AW,AH); aT+=.004;
  [{x:.18,y:.28,r:.45,c:'rgba(192,0,110,.12)',s:Math.sin(aT)},
   {x:.82,y:.72,r:.40,c:'rgba(255,45,85,.1)', s:Math.sin(aT+1.5)},
   {x:.50,y:.08,r:.35,c:'rgba(255,215,0,.07)',s:Math.cos(aT*.8)},
   {x:.08,y:.82,r:.30,c:'rgba(255,107,138,.09)',s:Math.cos(aT+2)},
   {x:.65,y:.45,r:.25,c:'rgba(192,0,110,.06)',s:Math.sin(aT+3)}
  ].forEach(b=>{
    const g=actx.createRadialGradient(
      (b.x+b.s*.06)*AW,(b.y+b.s*.04)*AH,0,
      (b.x+b.s*.06)*AW,(b.y+b.s*.04)*AH,b.r*Math.min(AW,AH));
    g.addColorStop(0,b.c); g.addColorStop(1,'transparent');
    actx.fillStyle=g; actx.fillRect(0,0,AW,AH);
  });
  requestAnimationFrame(drawAurora);
})();

// ─── PARTICLE CANVAS ──────────────────────────────────────────────────────────
const canvas=document.getElementById('particles'), ctx=canvas.getContext('2d');
let W,H;
const resizeP=()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;};
resizeP(); window.addEventListener('resize',resizeP);
const PCOLS=['#ff2d55','#ffd700','#ff8fa3','#e8a0c0','#fff','#ff6b8a','#c0006e','#ffafc0'];

class Particle{
  constructor(){this.reset(true);}
  reset(init=false){
    this.x=Math.random()*W; this.y=init?Math.random()*H:H+10;
    this.vx=(Math.random()-.5)*.55; this.vy=-(Math.random()*.95+.15);
    this.alpha=Math.random()*.65+.2; this.size=Math.random()*2.8+.4;
    this.life=0; this.maxLife=180+Math.random()*330;
    this.color=PCOLS[Math.floor(Math.random()*PCOLS.length)];
    this.type=Math.random()<.16?'heart':Math.random()<.08?'star':'dot';
    this.spin=(Math.random()-.5)*.07; this.angle=Math.random()*Math.PI*2;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.life++;this.angle+=this.spin;
    if(this.life>this.maxLife||this.y<-20)this.reset();}
  draw(){
    const a=this.alpha*(1-this.life/this.maxLife);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=this.color;
    ctx.shadowBlur=8;ctx.shadowColor=this.color;
    ctx.translate(this.x,this.y);ctx.rotate(this.angle);
    if(this.type==='heart'){ctx.font=`${this.size*6}px serif`;ctx.fillText('♥',0,0);}
    else if(this.type==='star'){ctx.font=`${this.size*5}px serif`;ctx.fillText('✦',0,0);}
    else{ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
const parts=Array.from({length:170},()=>new Particle());
(function animP(){ctx.clearRect(0,0,W,H);parts.forEach(p=>{p.update();p.draw();});requestAnimationFrame(animP);})();



function shootBurst(cx,cy){
  const el=document.createElement('div');
  const sx=(Math.random()-.5)*220, sy=(Math.random()-.5)*220;
  el.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;
    font-size:${16+Math.random()*22}px;pointer-events:none;z-index:9998;
    animation:sparkOut 1s ease-out forwards;--sx:${sx}px;--sy:${sy}px;`;
  el.textContent=['💖','✦','♥','💫','✨','🌹','💕','🎉'][Math.floor(Math.random()*8)];
  document.body.appendChild(el); setTimeout(()=>el.remove(),1050);
}

// ─── CURSOR ───────────────────────────────────────────────────────────────────
const cursor=document.getElementById('cursor');
const HEARTS=['💗','💖','💝','💕','❤️','💓','💞','🌹'];
let hIdx=0;
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';});
document.addEventListener('click',e=>{
  cursor.textContent=HEARTS[hIdx++%HEARTS.length];
  for(let i=0;i<10;i++) shootBurst(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];cursor.style.left=t.clientX+'px';cursor.style.top=t.clientY+'px';
},{passive:true});

// ─── SPARKOUT KEYFRAME ────────────────────────────────────────────────────────
const sty=document.createElement('style');
sty.textContent=`@keyframes sparkOut{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0;}}`;
document.head.appendChild(sty);
</script>
